<!doctype html>
<html><head><meta charset="utf-8">
<title>Artha AI logo options</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&family=Noto+Sans+Devanagari:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --g: #00B140; --lime: #BAFF29; --forest: #0F362D; }
  body { margin: 0; padding: 40px; background: #fff; font-family: 'DM Sans', sans-serif; color: #1b2420;
    background-image: radial-gradient(60% 50% at 0% 0%, #f3ffea 0, transparent 70%), radial-gradient(50% 40% at 100% 100%, #eafbe0 0, transparent 70%); }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -.02em; } h1 span { background: var(--lime); padding: 0 8px; }
  .sub { color: #5b6760; margin: 0 0 28px; font-size: 15px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
  .card { background: #fff; border: 1px solid #e2ece4; border-radius: 18px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 30px -22px rgba(15, 54, 45, .45); }
  .card.rec { border: 2px solid var(--g); }
  .top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5b6760; }
  .top b { color: var(--forest); } .tag { background: var(--lime); color: #111; padding: 2px 7px; border-radius: 6px; letter-spacing: .04em; }
  .hero { height: 110px; display: grid; place-items: center; background: #f7fbf5; border-radius: 12px; }
  .hero svg { width: 84px; height: 84px; }
  .lock { display: flex; align-items: center; gap: 8px; }
  .lock svg { width: 34px; height: 34px; }
  .word { font-weight: 600; font-size: 27px; letter-spacing: -.035em; color: var(--g); line-height: 1; }
  .word i { font-style: normal; color: var(--forest); }
  .row { display: flex; align-items: center; gap: 12px; }
  .dark { background: var(--forest); border-radius: 10px; padding: 8px; display: grid; place-items: center; }
  .dark svg { width: 28px; height: 28px; }
  .s24 svg { width: 24px; height: 24px; } .s16 svg { width: 16px; height: 16px; }
  .note { font-size: 12.5px; color: #5b6760; line-height: 1.4; }
</style></head><body>
<h1>Artha AI · <span>logo options</span></h1>
<p class="sub">Equal's palette: green #00B140, lime #BAFF29, forest #0F362D, DM Sans. Each mark at large, lockup, on dark, and favicon sizes.</p>
<div class="grid" id="grid"></div>
<script>
const G = '#00B140', L = '#BAFF29', F = '#0F362D';
const marks = [
  ['Dot equaliser', 'Equal-style dots stacked 1-2-3-2-1 into a voice wave.', true, c => `
    <circle cx="12" cy="32" r="4.6" fill="${c}"/><circle cx="22" cy="27" r="4.6" fill="${c}"/><circle cx="22" cy="37" r="4.6" fill="${c}"/>
    <circle cx="32" cy="22" r="4.6" fill="${c}"/><circle cx="32" cy="32" r="4.6" fill="${c}"/><circle cx="32" cy="42" r="4.6" fill="${c}"/>
    <circle cx="42" cy="27" r="4.6" fill="${c}"/><circle cx="42" cy="37" r="4.6" fill="${c}"/><circle cx="52" cy="32" r="4.6" fill="${c}"/>`],
  ['Rising dots', 'Three dots growing: a hint (ishaara) becoming a voice.', false, c => `
    <circle cx="13" cy="38" r="5" fill="${c}"/><circle cx="29" cy="33" r="8" fill="${c}"/><circle cx="49" cy="27" r="11" fill="${c}"/>`],
  ['Wave + bindu', 'Voice bars with a dot above the centre, the bindu of a hint.', false, c => `
    <rect x="4.5" y="32" width="7" height="16" rx="3.5" fill="${c}"/><rect x="16.5" y="25" width="7" height="30" rx="3.5" fill="${c}"/>
    <rect x="28.5" y="31" width="7" height="18" rx="3.5" fill="${c}"/><circle cx="32" cy="20.5" r="4.2" fill="${c}"/>
    <rect x="40.5" y="25" width="7" height="30" rx="3.5" fill="${c}"/><rect x="52.5" y="32" width="7" height="16" rx="3.5" fill="${c}"/>`],
  ['Speech bubble', 'A chat bubble with three dots. Friendly, says "talk to me".', false, c => `
    <path d="M14 10h36a10 10 0 0 1 10 10v18a10 10 0 0 1-10 10H30l-11 9v-9h-5A10 10 0 0 1 4 38V20a10 10 0 0 1 10-10z" fill="${c}"/>
    <circle cx="20" cy="29" r="4" fill="#fff"/><circle cx="32" cy="29" r="4" fill="#fff"/><circle cx="44" cy="29" r="4" fill="#${c === G ? 'BAFF29' : 'fff'}"/>`],
  ['Speaking', 'A dot with two sound arcs: someone speaks, Artha hears.', false, c => `
    <circle cx="18" cy="32" r="8" fill="${c}"/>
    <path d="M33 19a18 18 0 0 1 0 26" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round"/>
    <path d="M44 11a29 29 0 0 1 0 42" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round"/>`],
  ['Orb', 'The app\'s orb, flattened: a circle carrying a voice line.', false, c => `
    <circle cx="32" cy="32" r="27" fill="${c}"/>
    <path d="M13 32c4 0 5-9 9.5-9s5 18 9.5 18 5-18 9.5-18 5 9 9.5 9" fill="none" stroke="${c === G ? L : F}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`],
  ['अ tile', 'Devanagari "a" on a lime tile. Made for India first.', false, c => `
    <rect x="4" y="4" width="56" height="56" rx="16" fill="${c === G ? L : G}"/>
    <text x="32" y="45" text-anchor="middle" font-family="Noto Sans Devanagari" font-weight="700" font-size="36" fill="${F}">अ</text>`],
  ['Highlight a', 'Equal\'s lime highlight block behind a lowercase "a".', false, c => `
    <rect x="6" y="10" width="52" height="44" rx="6" fill="${L}"/>
    <text x="32" y="47" text-anchor="middle" font-family="DM Sans" font-weight="700" font-size="46" fill="${F}">a</text>`],
  ['Dot grid wave', 'A 3×5 dot grid; the lit dots trace a wave.', false, c => {
    const on = [[1], [0, 1], [0, 1, 2], [1, 2], [1]]; let s = '';
    for (let x = 0; x < 5; x++) for (let y = 0; y < 3; y++) s += `<circle cx="${12 + x * 10}" cy="${22 + y * 10}" r="4" fill="${on[x].includes(y) ? c : (c === G ? '#d7f2df' : '#2c5a4c')}"/>`;
    return s; }],
  ['Ring a', 'A geometric lowercase "a": ring plus stem, with a lime bindu.', false, c => `
    <circle cx="28" cy="34" r="15" fill="none" stroke="${c}" stroke-width="8"/>
    <rect x="43" y="14" width="8" height="40" rx="4" fill="${c}"/>
    <circle cx="28" cy="34" r="4.5" fill="${L}"/>`],
];
const svg = (fn, c) => `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">${fn(c)}</svg>`;
document.getElementById('grid').innerHTML = marks.map(([name, note, rec, fn], i) => `
  <div class="card${rec ? ' rec' : ''}">
    <div class="top"><span><b>${i + 1}</b> · ${name}</span>${rec ? '<span class="tag">Pick</span>' : ''}</div>
    <div class="hero">${svg(fn, G)}</div>
    <div class="lock">${svg(fn, G)}<span class="word">artha <i>ai</i></span></div>
    <div class="row"><div class="dark">${svg(fn, '#BAFF29')}</div><span class="s24">${svg(fn, G)}</span><span class="s16">${svg(fn, G)}</span></div>
    <p class="note">${note}</p>
  </div>`).join('');
</script>
</body></html>
