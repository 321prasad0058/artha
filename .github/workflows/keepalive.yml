name: Keep the API awake
# Render's free plan sleeps after 15 idle minutes; a ping every 10 minutes keeps notes fast.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.ARTHA_API_URL || 'https://artha-api.onrender.com' }}/api/health"
